<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetMon 网络监控平台</title>
    <script>
      // 全局固定浅色主题：清除历史残留的 dark class，避免首屏闪烁
      (function () {
        var root = document.documentElement;
        root.setAttribute('data-theme', 'light');
        root.classList.remove('dark');
        try { localStorage.setItem('theme', 'light'); } catch (e) {}
      })();
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #f4f6fb;
        color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(109, 94, 252, 0.2);
        border-top-color: #6d5efc;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="spinner"></div>
        <p id="initial-loader-text" style="margin-top: 14px; color: #67758d; font-size: 13px; letter-spacing: 1px;">NetMon 平台正在加载...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
