<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetMon 网络监控平台</title>
    <script>
      // 首屏前应用已存主题，避免闪烁；持久化由 ThemeContext 负责
      (function () {
        var dark = { dark: 1, ocean: 1 };
        var bg = { light: '#f4f6fb', dark: '#10141d', ocean: '#081222', sepia: '#f5f1e8', contrast: '#ffffff' };
        var id = 'light';
        try { var s = localStorage.getItem('theme'); if (s && bg[s]) id = s; } catch (e) {}
        var root = document.documentElement;
        root.setAttribute('data-theme', id);
        root.classList.toggle('dark', !!dark[id]);
        root.style.background = bg[id];
        root.style.colorScheme = dark[id] ? 'dark' : 'light';
      })();
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(109, 94, 252, 0.2);
        border-top-color: #6d5efc;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="spinner"></div>
        <p id="initial-loader-text" style="margin-top: 14px; color: #67758d; font-size: 13px; letter-spacing: 1px;">NetMon 平台正在加载...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
