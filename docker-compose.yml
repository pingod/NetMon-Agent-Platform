services:
  itops:
    build:
      context: .
      dockerfile: Dockerfile
    image: itops-agent-platform:latest
    container_name: itops-agent-platform
    restart: unless-stopped
    ports:
      - "${ITOP_PORT:-8088}:8088"
    environment:
      NODE_ENV: production
      PORT: "8088"
      DATABASE_PATH: /app/data/app.db
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 生产模式要求 >=32 字符；请在自己的 .env 中覆盖
      JWT_SECRET: ${JWT_SECRET:-itops-docker-default-jwt-secret-change-me-0123456789}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      # 告警 webhook：warn 模式可在未配置签名时放行并记录警告
      WEBHOOK_VERIFY_ENABLED: ${WEBHOOK_VERIFY_ENABLED:-warn}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      # AI 模型（也可登录后在“设置 → AI 配置”中配置）
      DOUBAO_API_KEY: ${DOUBAO_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOCAL_AI_API_BASE: ${LOCAL_AI_API_BASE:-}
    volumes:
      - itops-data:/app/data
      - itops-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  itops-data:
  itops-logs:
