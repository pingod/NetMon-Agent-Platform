# 项目名固定为 most_agent：仓库目录改名后仍复用原有 most_agent_itops-data/itops-logs 卷，避免数据丢失
name: most_agent

services:
  itops:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 国内网络直连 pypi 易超时；可用 PIP_INDEX_URL 覆盖（默认阿里云镜像）
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    image: itops-agent-platform:latest
    container_name: itops-agent-platform
    restart: unless-stopped
    ports:
      - "${ITOP_PORT:-8088}:8088"
    environment:
      NODE_ENV: production
      PORT: "8088"
      DATABASE_PATH: /app/data/app.db
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 必须显式提供：JWT_SECRET=... docker compose up -d（openssl rand -hex 32）
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必须在 .env 或环境中设置（openssl rand -hex 32）}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      # 告警 webhook：warn 模式可在未配置签名时放行并记录警告
      WEBHOOK_VERIFY_ENABLED: ${WEBHOOK_VERIFY_ENABLED:-warn}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      # AI 模型（也可登录后在“设置 → AI 配置”中配置）
      DOUBAO_API_KEY: ${DOUBAO_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOCAL_AI_API_BASE: ${LOCAL_AI_API_BASE:-}
    # 容器管理模块需要访问宿主 Docker；如不接受该权限，删除下面两行即可（页面会提示未配置宿主机）
    # docker.sock 属组：Linux 用 DOCKER_GID=$(stat -c %g /var/run/docker.sock)；Docker Desktop 默认 0
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - itops-data:/app/data
      - itops-logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  itops-data:
  itops-logs:
